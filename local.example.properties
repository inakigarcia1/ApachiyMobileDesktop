# =============================================================================
# Apachiy Desktop — local.properties template
# =============================================================================
# Copy this file to `local.properties` (gitignored) and fill in your values.
# Restart Android Studio's Gradle sync after editing.
# =============================================================================

# Android SDK (Android Studio usually writes this automatically)
# sdk.dir=C\:\\Users\\<you>\\AppData\\Local\\Android\\Sdk

# -----------------------------------------------------------------------------
# Apachiy backend (REQUIRED for cloud sync, profiles, library, auth)
# -----------------------------------------------------------------------------
# Public Supabase URL of your self-hosted Apachiy Supabase instance.
# Should start with https://. NO trailing slash.
APACHIY_SUPABASE_URL=https://your-apachiy-supabase.example

# Public anon key from your Apachiy Supabase (Project Settings -> API -> anon public).
# This is JWT-shaped. It is safe to embed in the APK; do NOT use the service_role key.
APACHIY_SUPABASE_ANON_KEY=eyJhbGciOi...

# -----------------------------------------------------------------------------
# Apachiy REST API (device registration, account/me, addons)
# -----------------------------------------------------------------------------
# Base URL of the Apachiy .NET API. NO trailing slash.
APACHIY_API_BASE_URL=https://your-apachiy-api.example

# Optional legacy key (legacy Nuvio fork used NUVIO_* prefix). Empty by default.
# IMPORTANT: leave empty. Apachiy production MUST NOT silently fall back to
# the official Nuvio backend (api.nuvio.tv).
NUVIO_SUPABASE_FALLBACK_URL=

# -----------------------------------------------------------------------------
# Avatar public URL (optional)
# -----------------------------------------------------------------------------
# Override the default Supabase Storage public URL for the avatars bucket.
# Default is built as: ${APACHIY_SUPABASE_URL}/storage/v1/object/public/avatars
AVATAR_PUBLIC_BASE_URL=

# -----------------------------------------------------------------------------
# Third-party integrations (optional; empty disables the feature)
# -----------------------------------------------------------------------------
TMDB_API_KEY=
TRAKT_CLIENT_ID=
TRAKT_CLIENT_SECRET=
TRAKT_REDIRECT_URI=apachiy://auth/trakt
SIMKL_CLIENT_ID=
SIMKL_REDIRECT_URI=apachiy://auth/simkl
SIMKL_APP_NAME=apachiy
PREMIUMIZE_CLIENT_ID=
INTRODB_API_URL=
IMDB_RATINGS_API_BASE_URL=
IMDB_TAPFRAME_API_BASE_URL=
CONTRIBUTIONS_URL=
SUPPORTERS_WALL_URL=
DONATIONS_BASE_URL=
DONATIONS_DONATE_URL=
PLAYBACK_REPORTS_BASE_URL=

# -----------------------------------------------------------------------------
# Sentry (telemetry)
# -----------------------------------------------------------------------------
# Leave SENTRY_DSN empty to disable Sentry entirely.
SENTRY_DSN=
