# =============================================================================
# Apachiy — local backend overlay (gitignored as local.dev.properties)
# =============================================================================
# Used only when running with:
#   .\scripts\run-desktop-local.ps1
#   ./scripts/run-desktop-local.sh
#   .\gradlew.bat :composeApp:run -Pnuvio.useLocalDev=true
#
# Cloud values in local.properties stay untouched. This file overrides only
# the keys you define here while nuvio.useLocalDev / APACHIY_USE_LOCAL_DEV=1.
#
# Desktop (:composeApp:run): use localhost below.
# Android emulator: replace localhost with 10.0.2.2
# Physical phone on LAN: use your machine IP (e.g. 192.168.x.x)
# =============================================================================

# Supabase Kong / API gateway (typical self-hosted compose port)
APACHIY_SUPABASE_URL=http://localhost:8000

# Anon key from your local Supabase (Project Settings -> API -> anon public).
# If your local stack uses the same JWT as production, you can copy it from local.properties.
APACHIY_SUPABASE_ANON_KEY=

# Apachiy .NET API (typical local compose port)
APACHIY_API_BASE_URL=http://localhost:10050

# Landing /tv-login — QR on TV opens this URL on the phone (Vite dev server)
APACHIY_TV_LOGIN_WEB_BASE_URL=http://localhost:5173/tv-login

# Optional: disable Sentry noise during local runs
SENTRY_DSN=
SENTRY_DESKTOP_DSN=
